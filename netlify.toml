[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/views"
  to = "/.netlify/functions/views"
  status = 200
  force = true

# The Studio is a client-rendered single-page route. Let it own its sub-paths.
[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200
